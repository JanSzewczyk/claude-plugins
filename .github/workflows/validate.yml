name: validate

# The repo ships Markdown, JSON and a few scripts, so there is little to build. What can break is
# agreement: a plugin nobody registered, an agent missing from plugin.json, a README claiming a
# skill count that stopped being true. This workflow is the guard for that.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  manifests:
    name: manifests and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      # The native schema pass needs the CLI; without it the script warns and skips that part
      # rather than failing, so this step is allowed to fail on a fork without the install.
      - name: Install Claude Code
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code

      - name: Check manifests and documentation
        run: node plugins/plugin-dev/skills/marketplace-creator/scripts/check-marketplace.mjs .

      - name: Test the marketplace scripts and the release planner
        run: >
          node --test
          plugins/plugin-dev/skills/marketplace-creator/tests/check-marketplace.test.mjs
          plugins/plugin-dev/skills/marketplace-creator/tests/check-cli.test.mjs
          plugins/plugin-dev/skills/plugin-release/tests/plan-release.test.mjs
          plugins/github/tests/apply-plan.test.mjs
          plugins/github/tests/read-settings.test.mjs

  cli:
    name: plugins load, install and stay in budget
    runs-on: ubuntu-latest
    # validate reads manifests; these steps ask the CLI itself. Load and install run in a
    # throwaway HOME and CLAUDE_CONFIG_DIR the script deletes afterwards, never the runner's own.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # A missing agent or skill path, a broken hooks file or a corrupt manifest: the plugin
      # loads with errors, or not at all, and validate can pass anyway.
      - name: Every plugin loads
        run: node plugins/plugin-dev/skills/marketplace-creator/scripts/check-cli.mjs . --load

      # marketplace add ./ then install <plugin>@szum-tech for each entry: a wrong source path, a
      # reserved name, a dependency range no plugin.json satisfies.
      - name: Every plugin installs from the marketplace
        run: node plugins/plugin-dev/skills/marketplace-creator/scripts/check-cli.mjs . --install

      # Skill and agent descriptions are paid in every session. Warn above 1,800, fail at 2,000.
      # Signed out, the CLI only estimates offline (25–40% low) and the limits scale down to
      # match; an ANTHROPIC_API_KEY secret, when the repo has one, gives counted figures.
      - name: Always-on token budget
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node plugins/plugin-dev/skills/marketplace-creator/scripts/check-cli.mjs . --budget

  skills:
    name: skill-audit sweep
    runs-on: ubuntu-latest
    # The mechanical half of skill-audit on every skill: frontmatter contract, description
    # length, dead links, orphan references. Errors fail the job; warnings are left to the author.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Audit every skill
        run: |
          status=0
          for dir in plugins/*/skills/*/; do
            if ! out=$(node plugins/skill-dev/skills/skill-audit/scripts/check-skill.mjs "$dir" 2>&1); then
              echo "::error file=${dir}SKILL.md::skill-audit found errors in ${dir}"
              echo "$out"
              status=1
            fi
          done
          exit $status

  knowledge:
    name: knowledge base renderings
    runs-on: ubuntu-latest
    # Skills and agents get generated copies of the notes in knowledge/. A note edited without a
    # rebuild, or a generated file edited by hand, is drift: check rebuilds in memory and fails on
    # any byte that differs, naming the file and whether it is stale or hand-edited.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Validate the notes
        run: node plugins/knowledge-dev/skills/knowledge-author/scripts/knowledge.mjs validate

      - name: Check the generated files are current
        run: node plugins/knowledge-dev/skills/knowledge-author/scripts/knowledge.mjs check

      - name: Lint the notes across the base
        # Warnings only (orphans, near-duplicates, a knowledge skill near its line budget): read
        # them in the log. Add --strict to make them fail. Offline: --links probes sources.
        run: node plugins/knowledge-dev/skills/knowledge-author/scripts/knowledge.mjs lint

      - name: Test the build script and the edit hook
        run: node --test plugins/knowledge-dev/skills/knowledge-author/tests/knowledge.test.mjs

  evals:
    name: skill routing evals (smoke)
    runs-on: ubuntu-latest
    # `claude plugin eval` is early access and needs both an API key and the enablement
    # variable, so this job only runs when the secrets are present. Without them it is skipped,
    # not failed — see plugins/*/evals/ for what it would run.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - ai-tools
          - code-quality
          - design
          - firebase
          - git-workflow
          - knowledge-dev
          - nextjs
          - plugin-dev
          - product-management
          - react
          - shared-rules
          - skill-dev
          - testing
          - typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the smoke routing cases
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude plugin eval "plugins/${{ matrix.plugin }}" \
            --tag smoke \
            --runs 2 \
            --model sonnet \
            --judge-model haiku \
            --threshold 0.8 \
            --no-publish \
            --json "eval-${{ matrix.plugin }}.json"

      - name: Upload the result document
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ matrix.plugin }}
          path: eval-${{ matrix.plugin }}.json
          if-no-files-found: ignore

  version-bumps:
    name: version bumps
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A plugin that pins `version` keeps users on the cached copy until the string changes, so a
      # change merged without a bump never reaches anyone. This is the shared action other plugin
      # repositories use; here it runs from the checkout.
      - name: Every changed plugin has a version bump
        uses: ./.github/actions/version-bump-check
