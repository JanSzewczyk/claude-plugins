name: Validate ✅

# The repo ships Markdown, JSON and a few scripts, so there is little to build. What can break is
# agreement: a plugin nobody registered, an agent missing from plugin.json, a README claiming a
# skill count that stopped being true. This workflow is the guard for that. Every job runs one of
# the shared actions in .github/actions, so other plugin repositories get what runs here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  manifests:
    name: Manifests and Docs 🔍
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7
      - name: Check manifests and documentation 🔍
        uses: ./.github/actions/marketplace-audit
      - name: Test the marketplace scripts and the release planner 🧪
        run: >
          node --test
          plugins/plugin-dev/skills/marketplace-creator/tests/check-marketplace.test.mjs
          plugins/plugin-dev/skills/marketplace-creator/tests/check-cli.test.mjs
          plugins/plugin-dev/skills/plugin-release/tests/plan-release.test.mjs
          plugins/github/tests/apply-plan.test.mjs
          plugins/github/tests/read-settings.test.mjs

  plugins-cli:
    name: Plugins in the CLI 🔌
    runs-on: ubuntu-latest
    # validate reads manifests; these steps ask the CLI itself. Load and install run in a
    # throwaway HOME and CLAUDE_CONFIG_DIR the script deletes afterwards, never the runner's own.
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7
      - name: Check every plugin loads 🔌
        uses: ./.github/actions/plugin-load-check
      - name: Check every plugin installs from the marketplace 📦
        uses: ./.github/actions/plugin-install-check
      - name: Check the always-on token budget ⚖️
        uses: ./.github/actions/plugin-budget-check
        with:
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}

  skills:
    name: Skill Audit 🔎
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7
      - name: Audit every skill 🔎
        uses: ./.github/actions/skill-audit

  knowledge:
    name: Knowledge Base 📚
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7
      - name: Check the knowledge base 📚
        uses: ./.github/actions/knowledge-check
      - name: Test the build script and the edit hook 🧪
        run: node --test plugins/knowledge-dev/skills/knowledge-author/tests/knowledge.test.mjs

  evals:
    name: Plugin Evals 🧪 (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    # `claude plugin eval` is early access and needs an API key, so this job only runs on a manual
    # dispatch and the action skips itself without the secret — see plugins/*/evals/.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - ai-tools
          - code-quality
          - design
          - firebase
          - git-workflow
          - knowledge-dev
          - nextjs
          - plugin-dev
          - product-management
          - react
          - shared-rules
          - skill-dev
          - testing
          - typescript
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7
      - name: Run the smoke routing cases 🧪
        uses: ./.github/actions/plugin-evals
        with:
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugins: plugins/${{ matrix.plugin }}
          artifact-name: eval-${{ matrix.plugin }}

  version-bumps:
    name: Version Bumps 🏷️
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7
      # A plugin that pins `version` keeps users on the cached copy until the string changes, so a
      # change merged without a bump never reaches anyone.
      - name: Check every changed plugin has a version bump 🏷️
        uses: ./.github/actions/version-bump-check
