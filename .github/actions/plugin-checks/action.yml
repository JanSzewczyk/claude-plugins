name: Plugin checks
description: >
  Fail a pull request whose plugin manifests or docs drifted from the plugins on disk, or that
  changed a plugin without bumping its version. Runs the plugin-dev scripts from the ref this
  action is pinned to, so the calling repository vendors nothing.

inputs:
  node-version:
    description: Node.js version the scripts run on.
    default: "26"
  install-claude:
    description: Install Claude Code so the doctor can run the native `claude plugin validate` pass. A failed install is ignored.
    default: "true"
  strict:
    description: Pass --strict to the doctor, so warnings fail the job too.
    default: "false"
  check-version-bumps:
    description: On pull requests, require a version bump for every changed plugin, in a marketplace or a single-plugin repo. Fetches the base history itself.
    default: "true"
  strict-version-bumps:
    description: Also fail when a bump is smaller than the change implies.
    default: "false"
  ignore-plugins:
    description: Comma-separated plugin names to leave out of the version bump check.
    default: ""
  base-ref:
    description: Branch the version bump check compares against.
    default: ${{ github.base_ref }}
  path:
    description: Root of the marketplace or single-plugin repository, relative to the workspace.
    default: "."
  check-load:
    description: Ask the CLI to load every plugin and fail on any that loads with errors. Needs Claude Code; runs in a throwaway config.
    default: "false"
  check-install:
    description: Add the marketplace and install every plugin in a throwaway config, failing on any install error. Needs Claude Code.
    default: "false"
  check-budget:
    description: Fail a plugin whose always-on tokens reach budget-fail, warn above budget-warn. Signed out, the CLI estimates offline and the limits scale down.
    default: "false"
  budget-warn:
    description: Always-on tokens above which the budget check warns.
    default: "1800"
  budget-fail:
    description: Always-on tokens at which the budget check fails.
    default: "2000"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install Claude Code
      if: inputs.install-claude == 'true'
      continue-on-error: true
      shell: bash
      run: npm install -g @anthropic-ai/claude-code

    - name: Manifests and documentation agree
      shell: bash
      env:
        SKILLS: ${{ github.action_path }}/../../../plugins/plugin-dev/skills
        STRICT: ${{ inputs.strict == 'true' && '--strict' || '' }}
        ROOT: ${{ inputs.path }}
      run: |
        if [ -f "$ROOT/.claude-plugin/marketplace.json" ]; then
          node "$SKILLS/marketplace-creator/scripts/check-marketplace.mjs" "$ROOT" $STRICT
        elif command -v claude >/dev/null; then
          # A single-plugin repo has no catalog to compare against: validate the plugin itself.
          claude plugin validate "$ROOT" --strict
        else
          echo "::error::No marketplace.json under $ROOT and Claude Code is not installed to validate the plugin."
          exit 1
        fi

    - name: Every changed plugin has a version bump
      if: inputs.check-version-bumps == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        SKILLS: ${{ github.action_path }}/../../../plugins/plugin-dev/skills
        ROOT: ${{ inputs.path }}
        BASE: ${{ inputs.base-ref }}
        STRICT: ${{ inputs.strict-version-bumps == 'true' && '--strict' || '' }}
        IGNORE: ${{ inputs.ignore-plugins }}
      run: |
        args=("$ROOT" --check --since "origin/$BASE")
        [ -n "$STRICT" ] && args+=("$STRICT")
        [ -n "$IGNORE" ] && args+=(--ignore "$IGNORE")
        node "$SKILLS/plugin-release/scripts/plan-release.mjs" "${args[@]}"

    - name: Plugins load, install and stay in budget
      if: inputs.check-load == 'true' || inputs.check-install == 'true' || inputs.check-budget == 'true'
      shell: bash
      env:
        SKILLS: ${{ github.action_path }}/../../../plugins/plugin-dev/skills
        ROOT: ${{ inputs.path }}
        CHECKS: >-
          ${{ inputs.check-load == 'true' && '--load' || '' }}
          ${{ inputs.check-install == 'true' && '--install' || '' }}
          ${{ inputs.check-budget == 'true' && '--budget' || '' }}
        WARN: ${{ inputs.budget-warn }}
        FAIL: ${{ inputs.budget-fail }}
      run: node "$SKILLS/marketplace-creator/scripts/check-cli.mjs" "$ROOT" $CHECKS --warn-at "$WARN" --fail-at "$FAIL"
