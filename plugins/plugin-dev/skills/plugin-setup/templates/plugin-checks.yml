name: plugin-checks

# Added by /plugin-setup. Fails a pull request whose manifests or docs drifted from the plugins
# on disk, or in which a plugin changed and its version did not. The checks come from the shared
# actions at the ref named below, so nothing is vendored into this repository.

on:
  push:
    branches: [main]
  pull_request:
  # BEGIN:evals
  workflow_dispatch:
  # END:evals

jobs:
  checks:
    name: manifests and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: JanSzewczyk/claude-plugins/.github/actions/plugin-checks@{{PLUGIN_DEV_REF}}
        with:
          # The version bump gate is its own job below, so it shows as its own check.
          check-version-bumps: "false"
          # BEGIN:cli
          check-load: "true"
          check-install: "true"
          check-budget: "true"
          # END:cli
          # Other inputs: strict, path.

  version-bumps:
    name: version bumps
    # Fails a pull request in which a plugin changed and its version did not. Works in a marketplace
    # and in a single-plugin repo, and fetches the base history itself, so no fetch-depth: 0.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: JanSzewczyk/claude-plugins/.github/actions/version-bump-check@{{PLUGIN_DEV_REF}}
        # Inputs: strict (also fail a bump that is too small), ignore-plugins, base-ref, path.

  # BEGIN:skills
  skills:
    name: skill audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: JanSzewczyk/claude-plugins/.github/actions/skill-audit@{{PLUGIN_DEV_REF}}
        # Inputs: path, skills-glob (default plugins/*/skills/*/).
  # END:skills

  # BEGIN:evals
  evals:
    name: plugin evals
    # Early access and billed per run, so manual only; the step is skipped without the secret.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: JanSzewczyk/claude-plugins/.github/actions/plugin-evals@{{PLUGIN_DEV_REF}}
        with:
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Inputs: plugins (default: every plugin with an evals/ folder), tag, runs, model, threshold.
  # END:evals
